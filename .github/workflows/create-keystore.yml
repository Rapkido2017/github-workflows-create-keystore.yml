name: Create Release Keystore (run once)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore out/release-upload.jks \
            -alias knowyourbible \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Know Your Bible, OU=Christian Education, O=Know Your Bible, L=Lagos, ST=Lagos, C=NG" > /dev/null 2>&1
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=knowyourbible"
            echo "KEY_PASSWORD=$PASS"
            echo -n "KEYSTORE_BASE64="
            base64 -w 0 out/release-upload.jks
            echo
          } > out/keystore-info.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: my-release-keystore
          path: out/
          retention-days: 1
